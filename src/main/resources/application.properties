spring.application.name=ticket-buy-be
spring.profiles.default=dev
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/ticketbuy;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.error.include-message=never
server.error.include-stacktrace=never
app.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:8080}
app.cookie-secure=${COOKIE_SECURE:false}
app.queue-capacity=${QUEUE_CAPACITY:50}
app.admission-seconds=${ADMISSION_SECONDS:600}
app.hold-seconds=${HOLD_SECONDS:300}
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health
