spring.application.name=ticket-buy-be
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.profiles.default=dev
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/ticketbuy;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.error.include-message=never
server.error.include-stacktrace=never
app.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:8080}
app.cookie-secure=${COOKIE_SECURE:false}
app.queue-capacity=${QUEUE_CAPACITY:50}
app.admission-seconds=${ADMISSION_SECONDS:600}
app.hold-seconds=${HOLD_SECONDS:300}
app.queue-admit-batch-size=${QUEUE_ADMIT_BATCH_SIZE:20}
app.queue-poll-seconds=${QUEUE_POLL_SECONDS:3}
app.seat-read-min-seconds=${SEAT_READ_MIN_SECONDS:2}
app.cleanup-ms=${QUEUE_WORKER_INTERVAL_MS:1000}
app.cleanup-initial-delay-ms=1000
app.session-cleanup-ms=60000
app.read-limit-max-keys=100000
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health
