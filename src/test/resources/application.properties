spring.datasource.url=${TEST_DB_URL:jdbc:h2:mem:ticketbuy;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000}
spring.datasource.username=${TEST_DB_USER:sa}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
app.origins=http://localhost:5173,http://localhost:8080
app.cookie-secure=false
app.queue-capacity=1
app.admission-seconds=600
app.hold-seconds=300
app.cleanup-ms=3600000
app.cleanup-initial-delay-ms=3600000
spring.profiles.active=dev
logging.level.root=WARN
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
