services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ticketbuy
      POSTGRES_USER: ticketbuy
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in environment or .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ticketbuy-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketbuy -d ticketbuy"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  ticketbuy-db:
